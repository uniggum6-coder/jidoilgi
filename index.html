<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0f3d3e">
<title>지도일기</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  :root{
    --navy:#0f3d3e; --teal:#1f6f6b; --sand:#f4efe6;
    --ink:#1d2b2b; --line:#dcd6c9; --white:#fff;
    --good:#1b8a4b; --warn:#c08a0a; --bad:#c0392b;
    --safe-b: env(safe-area-inset-bottom, 0px);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;overflow:hidden;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",
      "Noto Sans KR",sans-serif;
    background:var(--sand); color:var(--ink);
    font-size:15px; line-height:1.55; word-break:keep-all;
  }
  button{font-family:inherit;font-size:inherit;cursor:pointer;}

  /* ── 머리말 ── */
  #hdr{
    position:absolute;top:0;left:0;right:0;height:52px;z-index:900;
    background:var(--navy);color:#fff;display:flex;align-items:center;
    padding:0 12px;gap:10px;
  }
  #hdr h1{margin:0;font-size:17px;font-weight:700;letter-spacing:-.3px;}
  #hdr .sub{font-size:11.5px;opacity:.72;font-weight:500;}
  #hdr .sp{flex:1;}
  .hbtn{
    background:rgba(255,255,255,.16);color:#fff;border:none;border-radius:16px;
    padding:6px 12px;font-size:12.5px;font-weight:600;white-space:nowrap;
  }
  .hbtn:active{background:rgba(255,255,255,.3);}

  /* ── 본문 칸 ── */
  .page{position:absolute;top:52px;left:0;right:0;bottom:calc(60px + var(--safe-b));display:none;}
  .page.on{display:block;}
  #map{position:absolute;inset:0;background:#dfe6e3;}

  /* 지도 위 작은 안내 */
  #mapHint{
    position:absolute;left:10px;right:10px;bottom:10px;z-index:500;
    background:rgba(255,255,255,.94);border:1px solid var(--line);border-radius:10px;
    padding:9px 12px;font-size:12.5px;color:#4a5a58;box-shadow:0 2px 8px rgba(0,0,0,.08);
    display:none;
  }
  #mapHint b{color:var(--navy);}

  /* 핀 손보기 띠 */
  #fixBar{
    position:absolute;left:0;right:0;top:0;z-index:950;background:var(--warn);color:#fff;
    padding:10px 12px;font-size:13px;display:none;align-items:center;gap:8px;
  }
  #fixBar.on{display:flex;}
  #fixBar span{flex:1;}
  #fixBar button{
    background:#fff;color:#8a6200;border:none;border-radius:14px;padding:5px 12px;
    font-weight:700;font-size:12.5px;
  }
  #fixBar button.ghost{background:rgba(255,255,255,.25);color:#fff;}

  /* ── 아래 단추 ── */
  #nav{
    position:absolute;left:0;right:0;bottom:0;z-index:1200;
    height:calc(60px + var(--safe-b));padding-bottom:var(--safe-b);
    background:#fff;border-top:1px solid var(--line);
    display:flex;align-items:stretch;
  }
  #nav{overflow:visible;}
  #nav button{
    flex:1;background:none;border:none;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:2px;color:#8b9795;font-size:11px;
    font-weight:600;padding:0;
  }
  #nav button .ic{
    width:23px;height:23px;display:flex;align-items:center;justify-content:center;
  }
  #nav button .ic svg{width:23px;height:23px;display:block;}
  #nav button.on{color:var(--navy);}
  /* 촬영도 지도·기록과 같은 크기로. 가운데만 색으로 채워 눈에 띄게 한다. */
  #nav button#navShoot .ic{
    width:38px;height:38px;border-radius:50%;
    background:var(--navy);color:#fff;
    display:flex;align-items:center;justify-content:center;
    margin:-4px 0 1px;border:none;
  }
  #nav button#navShoot .ic svg{width:21px;height:21px;}
  #nav button#navShoot:active .ic{transform:scale(.94);}
  #nav button#navShoot{color:var(--navy);}

  /* ── 목록 ── */
  #listPage{overflow-y:auto;-webkit-overflow-scrolling:touch;background:var(--sand);}
  #srchWrap{
    position:sticky;top:0;z-index:10;background:var(--sand);
    padding:10px 12px 8px;border-bottom:1px solid var(--line);
  }
  #srch{
    width:100%;border:1px solid var(--line);border-radius:18px;padding:9px 14px;
    font-size:14px;background:#fff;color:var(--ink);
  }
  #srch:focus{outline:none;border-color:var(--teal);}
  .perRow{display:flex;gap:6px;margin-top:8px;align-items:center;flex-wrap:wrap;}
  .perRow input[type=date]{
    flex:1;min-width:0;border:1px solid var(--line);border-radius:12px;padding:6px 8px;
    font-size:12.5px;background:#fff;color:var(--ink);font-family:inherit;
  }
  .perRow .tl{font-size:12px;color:#7b8785;}
  .perRow button{
    background:#fff;border:1px solid var(--line);border-radius:12px;padding:6px 10px;
    font-size:12px;color:#5a6a68;
  }
  #cnt{padding:8px 14px 2px;font-size:12px;color:#7b8785;}
  .card{
    display:flex;gap:11px;background:#fff;margin:8px 12px;border-radius:12px;
    border:1px solid var(--line);padding:10px;align-items:flex-start;
  }
  .card:active{background:#faf8f4;}
  .card .th{
    width:72px;height:72px;flex:0 0 72px;border-radius:9px;background:#eceae4;
    object-fit:cover;display:block;
  }
  .card .thbox{position:relative;flex:0 0 72px;}
  .card .vmark{
    position:absolute;right:3px;bottom:3px;background:rgba(0,0,0,.6);color:#fff;
    border-radius:5px;font-size:10px;padding:1px 4px;font-weight:600;
  }
  .card .bd{flex:1;min-width:0;}
  .card .del{
    flex:0 0 auto;align-self:center;border:1px solid var(--line);background:#fff;
    color:#b4452f;border-radius:9px;width:30px;height:30px;font-size:16px;
    line-height:1;padding:0;margin-left:2px;
  }
  .card .del:active{background:#fbe6e3;}
  .card .dt{font-size:12px;color:#7b8785;font-weight:600;}
  .card .mm{
    font-size:13.5px;margin:3px 0 5px;color:var(--ink);
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  }
  .card .mm.none{color:#a8b2b0;font-style:italic;}
  .card .meta{font-size:11.5px;color:#8b9795;display:flex;gap:7px;flex-wrap:wrap;align-items:center;}
  .acc{font-weight:700;font-size:11px;padding:1px 6px;border-radius:9px;white-space:nowrap;}
  .acc.g{background:#e4f3ea;color:var(--good);}
  .acc.w{background:#fbf2dd;color:var(--warn);}
  .acc.b{background:#fbe6e3;color:var(--bad);}
  .up{font-size:11px;font-weight:700;padding:1px 6px;border-radius:9px;
      background:#e8eff2;color:#2a6072;white-space:nowrap;}
  #hdr .me{font-size:11.5px;opacity:.8;max-width:92px;overflow:hidden;
           text-overflow:ellipsis;white-space:nowrap;}
  .empty{padding:48px 28px;text-align:center;color:#99a4a2;font-size:14px;}
  .empty .big{font-size:34px;margin-bottom:10px;}

  /* ── 촬영 화면 ── */
  #cam{
    position:fixed;inset:0;z-index:2000;background:#000;display:none;flex-direction:column;
  }
  #cam.on{display:flex;}
  #camView{flex:1;position:relative;overflow:hidden;background:#000;}
  #camVideo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
  #camTop{
    position:absolute;top:0;left:0;right:0;padding:calc(10px + env(safe-area-inset-top,0px)) 12px 10px;
    display:flex;align-items:center;gap:8px;
    background:linear-gradient(rgba(0,0,0,.55),transparent);
  }
  #camClose{
    background:rgba(0,0,0,.45);color:#fff;border:none;width:34px;height:34px;
    border-radius:50%;font-size:17px;line-height:1;
  }
  #gpsChip{
    display:flex;align-items:center;gap:6px;background:rgba(0,0,0,.5);
    border-radius:16px;padding:5px 11px;color:#fff;font-size:12.5px;font-weight:700;
  }
  #gpsDot{width:9px;height:9px;border-radius:50%;background:#888;flex:0 0 9px;}
  #gpsDot.g{background:#2ecc71;box-shadow:0 0 6px rgba(46,204,113,.8);}
  #gpsDot.w{background:#f1c40f;box-shadow:0 0 6px rgba(241,196,15,.8);}
  #gpsDot.b{background:#e74c3c;box-shadow:0 0 6px rgba(231,76,60,.8);}
  #gpsNote{
    position:absolute;top:calc(56px + env(safe-area-inset-top,0px));left:12px;right:12px;
    background:rgba(0,0,0,.52);color:#fff;border-radius:9px;padding:7px 11px;
    font-size:12px;line-height:1.5;display:none;
  }
  #recChip{
    position:absolute;top:calc(14px + env(safe-area-inset-top,0px));left:50%;
    transform:translateX(-50%);background:rgba(192,57,43,.92);color:#fff;
    border-radius:14px;padding:4px 12px;font-size:12.5px;font-weight:700;display:none;
    align-items:center;gap:6px;
  }
  #recChip.on{display:flex;}
  #recChip .blink{width:8px;height:8px;border-radius:50%;background:#fff;animation:bl 1s infinite;}
  @keyframes bl{0%,100%{opacity:1}50%{opacity:.25}}

  #shots{
    position:absolute;left:0;right:0;bottom:0;padding:8px 10px;display:flex;gap:7px;
    overflow-x:auto;background:linear-gradient(transparent,rgba(0,0,0,.5));
  }
  #shots .sh{position:relative;flex:0 0 auto;}
  #shots .sh img{width:52px;height:52px;object-fit:cover;border-radius:7px;border:2px solid #fff;display:block;}
  #shots .sh .x{
    position:absolute;top:-5px;right:-5px;width:19px;height:19px;border-radius:50%;
    background:#000;color:#fff;border:1px solid #fff;font-size:11px;line-height:17px;
    text-align:center;padding:0;
  }
  #shots .sh .vb{
    position:absolute;left:2px;bottom:2px;background:rgba(0,0,0,.65);color:#fff;
    font-size:9px;border-radius:4px;padding:0 3px;font-weight:700;
  }

  #camBar{
    background:#111;padding:12px 14px calc(14px + var(--safe-b));
    display:flex;align-items:center;gap:12px;
  }
  #modeSw{display:flex;background:#2a2a2a;border-radius:16px;padding:3px;flex:0 0 auto;}
  #modeSw button{
    background:none;border:none;color:#9a9a9a;font-size:12.5px;font-weight:700;
    padding:5px 12px;border-radius:13px;
  }
  #modeSw button.on{background:#fff;color:#111;}
  #shutter{
    width:62px;height:62px;border-radius:50%;background:#fff;border:4px solid #555;
    flex:0 0 62px;margin:0 auto;padding:0;
  }
  #shutter:active{transform:scale(.94);}
  #shutter:disabled{opacity:.45;}
  #flash{
    position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;
    transition:opacity .12s;
  }
  #flash.on{opacity:.85;transition:none;}
  #shutter.rec{background:#e74c3c;border-color:#fff;border-radius:16px;width:56px;height:56px;}
  #camDone{
    background:var(--navy);color:#fff;border:none;border-radius:18px;padding:9px 15px;
    font-size:13px;font-weight:700;flex:0 0 auto;opacity:.35;
  }
  #camDone.on{opacity:1;}
  #camErr{
    position:absolute;inset:0;display:none;flex-direction:column;align-items:center;
    justify-content:center;gap:12px;padding:30px;text-align:center;color:#fff;
    background:#111;font-size:14px;line-height:1.6;
  }
  #camErr.on{display:flex;}
  #camErr button{
    background:#fff;color:#111;border:none;border-radius:16px;padding:9px 18px;font-weight:700;
  }

  /* ── 기록 자세히 보기 ── */
  #sheet{
    position:fixed;inset:0;z-index:1500;background:rgba(0,0,0,.45);display:none;
    align-items:flex-end;
  }
  #sheet.on{display:flex;}
  #sheetBox{
    background:var(--sand);width:100%;max-height:92%;border-radius:16px 16px 0 0;
    display:flex;flex-direction:column;overflow:hidden;
  }
  #sheetHd{
    display:flex;align-items:center;gap:10px;padding:12px 14px;background:#fff;
    border-bottom:1px solid var(--line);
  }
  #sheetHd .t{flex:1;font-weight:700;font-size:14.5px;}
  #sheetHd button{background:none;border:none;font-size:19px;color:#7b8785;padding:2px 4px;}
  #sheetBody{overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:18px;}
  #bigWrap{background:#000;position:relative;}
  #bigWrap img,#bigWrap video{width:100%;max-height:58vh;object-fit:contain;display:block;background:#000;}
  #bigWrap{touch-action:pan-y;user-select:none;}
  .bigCount{
    position:absolute;top:9px;left:50%;transform:translateX(-50%);
    background:rgba(0,0,0,.6);color:#fff;border-radius:13px;padding:3px 11px;
    font-size:12px;font-weight:700;pointer-events:none;z-index:3;
  }
  .bigArrow{
    position:absolute;top:50%;transform:translateY(-50%);z-index:3;
    width:40px;height:40px;border-radius:50%;border:none;
    background:rgba(0,0,0,.42);color:#fff;font-size:20px;line-height:40px;
    padding:0;text-align:center;
  }
  .bigArrow:active{background:rgba(0,0,0,.65);}
  .bigArrow.l{left:8px;} .bigArrow.r{right:8px;}
  .bigDel,.bigSave{
    position:absolute;top:8px;z-index:4;border:none;
    background:rgba(0,0,0,.5);color:#fff;border-radius:16px;
    padding:6px 12px;font-size:12.5px;font-weight:700;
  }
  .bigDel{right:8px;}
  .bigSave{left:8px;}
  .bigDel:active{background:rgba(192,57,43,.9);}
  .bigSave:active{background:rgba(31,111,107,.95);}
  .bigArrow[disabled]{opacity:0;pointer-events:none;}
  #bigNav{
    display:flex;gap:6px;padding:7px 10px;overflow-x:auto;background:#111;
  }
  #bigNav button{
    flex:0 0 auto;background:none;border:2px solid transparent;padding:0;border-radius:7px;
    line-height:0;
  }
  #bigNav button.on{border-color:#fff;}
  #bigNav img{width:46px;height:46px;object-fit:cover;border-radius:5px;display:block;}
  .sec{background:#fff;margin:10px 12px;border:1px solid var(--line);border-radius:12px;padding:12px 13px;}
  .sec h3{margin:0 0 8px;font-size:12px;color:#7b8785;font-weight:700;letter-spacing:.2px;}
  .kv{display:flex;gap:10px;font-size:13.5px;padding:4px 0;}
  .kv .k{flex:0 0 72px;color:#8b9795;font-size:12.5px;}
  .kv .v{flex:1;min-width:0;}
  #memoEd{
    width:100%;border:1px solid var(--line);border-radius:10px;padding:10px;
    font-size:14px;font-family:inherit;line-height:1.6;resize:vertical;min-height:84px;
    color:var(--ink);background:#fdfcfa;
  }
  #memoEd:focus{outline:none;border-color:var(--teal);}
  .btnRow{display:flex;gap:8px;margin:0 12px 12px;}
  .btnRow button{
    flex:1;border:1px solid var(--line);background:#fff;border-radius:12px;padding:11px;
    font-size:13.5px;font-weight:700;color:var(--navy);
  }
  .btnRow button.pri{background:var(--navy);color:#fff;border-color:var(--navy);}
  .btnRow button.dng{color:var(--bad);}

  /* ── 작은 창 ── */
  #dlg{
    position:fixed;inset:0;z-index:1800;background:rgba(0,0,0,.45);display:none;
    align-items:center;justify-content:center;padding:22px;
  }
  #dlg.on{display:flex;}
  #dlgBox{
    background:#fff;border-radius:14px;width:100%;max-width:360px;padding:18px;
    max-height:86vh;overflow-y:auto;
  }
  #dlgBox h2{margin:0 0 6px;font-size:16px;}
  #dlgBox p{margin:0 0 14px;font-size:13.5px;color:#5a6a68;line-height:1.6;}
  #dlgBox label{display:block;font-size:12px;color:#7b8785;font-weight:700;margin:10px 0 4px;}
  #dlgBox input,#dlgBox select{
    width:100%;border:1px solid var(--line);border-radius:10px;padding:9px 11px;
    font-size:14px;font-family:inherit;color:var(--ink);background:#fdfcfa;
  }
  #dlgBtns{display:flex;gap:8px;margin-top:16px;}
  #dlgBtns button{
    flex:1;border:1px solid var(--line);background:#fff;border-radius:11px;padding:10px;
    font-weight:700;font-size:13.5px;color:#5a6a68;
  }
  #dlgBtns button.pri{background:var(--navy);color:#fff;border-color:var(--navy);}
  #prog{margin-top:12px;font-size:13px;color:var(--teal);font-weight:600;display:none;}

  /* 알림 띠 */
  #toast{
    position:fixed;left:50%;bottom:calc(76px + var(--safe-b));transform:translateX(-50%);
    background:rgba(29,43,43,.94);color:#fff;padding:10px 16px;border-radius:20px;
    font-size:13px;z-index:2500;opacity:0;pointer-events:none;transition:opacity .22s;
    max-width:86%;text-align:center;line-height:1.5;
  }
  #toast.on{opacity:1;}

  /* 화면이 넓은 컴퓨터에서는 창이 가로로 늘어지지 않게 한다 */
  @media (min-width: 760px){
    /* 기록은 왼쪽에 붙은 칸으로 뜬다. 오른쪽 지도는 그대로 보이고 움직일 수 있다. */
    #sheet{
      top:52px;bottom:0;left:0;right:auto;width:auto;
      background:transparent;pointer-events:none;
      align-items:stretch;justify-content:flex-start;padding:0;
    }
    #sheetBox{
      pointer-events:auto;
      width:400px;max-width:400px;height:100%;max-height:100%;
      border-radius:0;border-right:1px solid var(--line);
      box-shadow:6px 0 26px rgba(0,0,0,.22);
    }
    #bigWrap img,#bigWrap video{max-height:42vh;}
    #toast{left:auto;right:28px;transform:none;bottom:88px;}

    /* 지도는 늘 보인다. 기록 목록은 왼쪽 좁은 칸으로 그 위에 얹힌다. */
    #mapPage{display:block;}
    #listPage{
      width:400px;right:auto;
      border-right:1px solid var(--line);
      box-shadow:6px 0 26px rgba(0,0,0,.18);
      z-index:600;
    }
    #srchWrap{padding:10px 12px 8px;}
    #cards .card{margin-left:12px;margin-right:12px;}
    /* 아래 단추도 왼쪽 칸 아래에 둔다 */
    #nav{
      left:0;right:auto;width:400px;border-right:1px solid var(--line);
    }
    /* 지도 확대 단추가 왼쪽 칸에 가리지 않게 오른쪽으로 밀어둔다 */
    .leaflet-top.leaflet-left{left:408px;}
    #listPage{z-index:1100;}
    #mapHint{left:420px;right:14px;}
  }

  /* 지도 단추 */
  .leaflet-bar.basectl a{
    width:auto;min-width:46px;height:30px;line-height:30px;padding:0 10px;
    font-size:12.5px;font-weight:700;color:var(--ink);background:#fff;
    text-decoration:none;text-align:center;white-space:nowrap;display:block;
  }
  .pinico{display:block;}
  .leaflet-popup-content{margin:9px 11px;font-size:13px;min-width:140px;}
  .leaflet-popup-content .pm{font-weight:600;margin-bottom:3px;}
  .leaflet-popup-content .pd{font-size:11.5px;color:#7b8785;}
  .leaflet-popup-content button{
    margin-top:7px;width:100%;background:var(--navy);color:#fff;border:none;
    border-radius:9px;padding:7px;font-size:12.5px;font-weight:700;
  }
  .leaflet-container{font-family:inherit;}
</style>
</head>
<body>

<div id="hdr">
  <h1>지도일기</h1>
  <span class="sub" id="hdrSub"></span>
  <span class="me"></span>
  <span class="sp"></span>
  <button class="hbtn" id="btnDrive">로그인</button>
  <button class="hbtn" id="btnExport">내려받기</button>
</div>

<div class="page on" id="mapPage">
  <div id="fixBar">
    <span>지도를 움직여 핀을 옳은 자리로 옮기고 저장을 누르십시오.</span>
    <button id="fixSave">저장</button>
    <button class="ghost" id="fixCancel">취소</button>
  </div>
  <div id="map"></div>
  <div id="mapHint"></div>
</div>

<div class="page" id="listPage">
  <div id="srchWrap">
    <input type="search" id="srch" placeholder="메모 내용으로 찾기" autocomplete="off">
    <div class="perRow">
      <input type="date" id="dFrom" aria-label="시작일">
      <span class="tl">~</span>
      <input type="date" id="dTo" aria-label="끝일">
      <button id="dClear">전체</button>
    </div>
  </div>
  <div id="cnt"></div>
  <div id="cards"></div>
</div>

<div id="nav">

<script>
/* ======================================================================
   지도일기 — 1차 본체
   이 판은 기기(브라우저) 저장만 씁니다. 구글 로그인과 드라이브 연결은
   캐패시터로 껍데기를 씌운 뒤에 붙입니다.

/* ── 작은 도구들 ────────────────────────────────────────────────── */
const $ = s => document.querySelector(s);
const el = (t,c) => { const d=document.createElement(t); if(c) d.className=c; return d; };

const ACC_LINE = 30;            // 초록/빨강을 가르는 선 (m)
const VIDEO_MAX = 180;          // 영상 최대 길이 (초) = 3분

function accGrade(a){           // 오차 등급
  if(a==null) return 'b';
  if(a <= ACC_LINE) return 'g';
  if(a <= ACC_LINE*2.5) return 'w';
  return 'b';
}
function accText(a){
  if(a==null) return '위치 없음';
  if(a >= 1000) return '±' + (a/1000).toFixed(a>=10000?0:1) + 'km';
  return '±' + (a<10 ? a.toFixed(1) : Math.round(a)) + 'm';
}
function pad(n){ return n<10 ? '0'+n : ''+n; }
function fmtDT(ms){
  const d = new Date(ms);
  return d.getFullYear()+'.'+pad(d.getMonth()+1)+'.'+pad(d.getDate())+
         ' '+pad(d.getHours())+':'+pad(d.getMinutes());
}
function fmtDate(ms){
  const d = new Date(ms);
  return d.getFullYear()+'.'+pad(d.getMonth()+1)+'.'+pad(d.getDate());
}
function fileStamp(ms){
  const d = new Date(ms);
  return d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate())+'_'+
         pad(d.getHours())+pad(d.getMinutes())+pad(d.getSeconds());
}
function todayStr(){
  const d = new Date();
  return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
}
function dur(sec){ return Math.floor(sec/60)+':'+pad(Math.floor(sec%60)); }
function mb(b){ return b>=1048576 ? (b/1048576).toFixed(1)+'MB' : Math.round(b/1024)+'KB'; }

let toastT = null;
function toast(msg, ms){
  const t = $('#toast');
  t.textContent = msg; t.classList.add('on');
  clearTimeout(toastT);
  toastT = setTimeout(()=>t.classList.remove('on'), ms||2200);
}

/* 작은 창 — 확인받기 / 칸 채우기 */
function dialog(opt){
  return new Promise(res=>{
    $('#dlgTitle').textContent = opt.title||'';
    $('#dlgText').textContent  = opt.text||'';
    $('#dlgText').style.display = opt.text ? '' : 'none';
    $('#dlgFields').innerHTML = opt.html||'';
    $('#dlgYes').textContent = opt.yes||'확인';
    $('#dlgNo').textContent  = opt.no||'취소';
    $('#dlgNo').style.display = opt.noHide ? 'none' : '';
    $('#dlgYes').className = opt.danger ? '' : 'pri';
    if(opt.danger) $('#dlgYes').style.color = 'var(--bad)';
    else $('#dlgYes').style.color = '';
    $('#prog').style.display='none'; $('#prog').textContent='';
    $('#dlg').classList.add('on');
    if(opt.after) opt.after();
    const done = v => {
      $('#dlg').classList.remove('on');
      $('#dlgYes').onclick=null; $('#dlgNo').onclick=null;
      res(v);
    };
    let running = false;
    $('#dlgYes').onclick = ()=>{
      if(opt.hold){
        if(running) return;
        running = true;
        $('#dlgYes').style.opacity = '.5';
        Promise.resolve(opt.hold(done)).finally(()=>{
          running = false; $('#dlgYes').style.opacity = '';
        });
      } else done(true);
    };
    $('#dlgNo').onclick  = ()=>done(false);
  });
}
function dlgProg(msg){
  const p=$('#prog'); p.style.display = msg? '':'none'; p.textContent = msg||'';
}

/* ── 기기 저장 (IndexedDB) ─────────────────────────────────────── */
const DB = (()=>{
  const NAME='jidoilgi', VER=1, STORE='records';
  let db = null;
  function open(){
    return new Promise((res,rej)=>{
      if(db) return res(db);
      const rq = indexedDB.open(NAME, VER);
      rq.onupgradeneeded = e => {
        const d = e.target.result;
        if(!d.objectStoreNames.contains(STORE)){
          const s = d.createObjectStore(STORE, {keyPath:'id'});
          s.createIndex('createdAt','createdAt');
        }
      };
      rq.onsuccess = e => { db = e.target.result; res(db); };
      rq.onerror   = e => rej(e.target.error);
    });
  }
  function tx(mode){
    return open().then(d=>d.transaction(STORE, mode).objectStore(STORE));
  }
  // 쓰기는 거래(transaction)가 끝까지 마쳐야 진짜 저장이다.
  // 요청이 받아들여진 것만 보고 성공이라 하면, 공간이 모자라 되돌려져도 모른다.
  function write(fn){
    return open().then(d=>new Promise((res,rej)=>{
      const t = d.transaction(STORE,'readwrite');
      const st = t.objectStore(STORE);
      let out = null, failed = null;
      try{ out = fn(st); }catch(e){ rej(e); return; }
      t.oncomplete = ()=>{ failed ? rej(failed) : res(out); };
      t.onabort = ()=>rej(t.error || failed || new Error('저장이 되돌려졌습니다'));
      t.onerror = ()=>rej(t.error || failed || new Error('저장에 실패했습니다'));
    }));
  }
  return {
    all(){
      return tx('readonly').then(s=>new Promise((res,rej)=>{
        const r = s.getAll();
        r.onsuccess = ()=>res(r.result.sort((a,b)=>b.createdAt-a.createdAt));
        r.onerror   = ()=>rej(r.error);
      }));
    },
    get(id){
      return tx('readonly').then(s=>new Promise((res,rej)=>{
        const r = s.get(id);
        r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error);
      }));
    },
    put(rec){
      return write(st=>{ st.put(rec); return rec; });
    },
    del(id){
      return write(st=>{ st.delete(id); return true; });
    }
  };
})();

let records = [];   // 머리 속 사본 (최근순)

/* 사진·영상은 기기에 '덩어리(ArrayBuffer)'로 저장한다.
   폰 브라우저 중에는 Blob 을 그대로 넣으면 나중에 못 꺼내는 것이 있다. */
function mediaMime(m){
  return m.mime || (m.type==='video' ? 'video/mp4' : 'image/jpeg');
}
function mediaBlob(m){
  if(m.blob) return m.blob;                       // 옛 기록
  if(m.buf)  return new Blob([m.buf], {type:mediaMime(m)});
  return null;
}
function thumbBlob(m){
  if(m.thumb) return m.thumb;                     // 옛 기록
  if(m.thumbBuf) return new Blob([m.thumbBuf], {type:'image/jpeg'});
  return null;
}

/* ── 위치 잡기 ─────────────────────────────────────────────────── */
const GPS = (()=>{
  let watchId=null, best=null, last=null, listeners=[];
  const KEEP = 20000;            // 이만큼 지난 값은 버린다 (ms)

  function onFix(p){
    const f = {
      lat:p.coords.latitude, lng:p.coords.longitude,
      acc:p.coords.accuracy,
      alt:(p.coords.altitude!=null? p.coords.altitude : null),
      altAcc:(p.coords.altitudeAccuracy!=null? p.coords.altitudeAccuracy : null),
      heading:(p.coords.heading!=null && !isNaN(p.coords.heading) ? p.coords.heading : null),
      t: p.timestamp || Date.now()
    };
    last = f;
    // 더 정확한 값이거나, 기존 best가 오래됐으면 갈아끼운다
    if(!best || f.acc <= best.acc || (Date.now()-best.t) > KEEP) best = f;
    listeners.forEach(fn=>{ try{ fn(current()); }catch(e){} });
  }
  let lastErr = null;
  function onErr(e){
    lastErr = e;
    listeners.forEach(fn=>{ try{ fn(current(), e); }catch(_){} });
  }
  function current(){
    if(best && (Date.now()-best.t) <= KEEP) return best;
    return last;
  }
  return {
    start(){
      if(watchId!=null) return;
      best=null;
      if(!navigator.geolocation){ onErr({code:-1}); return; }
      watchId = navigator.geolocation.watchPosition(onFix, onErr, {
        enableHighAccuracy:true, timeout:20000, maximumAge:0
      });
    },
    stop(){
      if(watchId!=null){ navigator.geolocation.clearWatch(watchId); watchId=null; }
    },
    reset(){ best=null; },
    err(){ return lastErr; },
    current,
    // 지금 당장 한 번 받아본다 (watch 와 별개)
    once(ms){
      return new Promise(res=>{
        if(!navigator.geolocation) return res(null);
        let done=false;
        const fin = v=>{ if(!done){ done=true; res(v); } };
        navigator.geolocation.getCurrentPosition(
          p=>{ onFix(p); fin(current()); },
          e=>{ lastErr=e; fin(current()); },
          {enableHighAccuracy:true, timeout:(ms||10000), maximumAge:0}
        );
        setTimeout(()=>fin(current()), (ms||10000)+500);
      });
    },
    on(fn){ listeners.push(fn); },
    off(fn){ listeners = listeners.filter(x=>x!==fn); }
  };
})();

/* ── 좌표를 주소로 바꾸기 (카카오) ──────────────────────────── */
let kakaoReady = false, kakaoGeo = null;
(function initKakao(){
  try{
    if(window.kakao && kakao.maps && kakao.maps.load){
      kakao.maps.load(()=>{
        try{ kakaoGeo = new kakao.maps.services.Geocoder(); kakaoReady = true; }catch(e){}
      });
    }
  }catch(e){}
})();

/* 그 자리의 주소를 받아온다. 못 받으면 null 을 준다. */
function addressOf(lat, lng){
  return new Promise(res=>{
    if(!kakaoReady || !kakaoGeo) return res(null);
    try{
      kakaoGeo.coord2Address(lng, lat, (r, st)=>{
        if(st !== kakao.maps.services.Status.OK || !r || !r[0]) return res(null);
        const road = r[0].road_address && r[0].road_address.address_name;
        const jibun = r[0].address && r[0].address.address_name;
        res({road: road||'', jibun: jibun||''});
      });
    }catch(e){ res(null); }
    setTimeout(()=>res(null), 6000);
  });
}

/* ── 지도 ──────────────────────────────────────────────────────── */
let map, markerLayer, meMarker, fixMarker=null, fixRec=null;

const VWORLD_KEY = '619093BB-C6F2-4A99-81E2-077A7E973171';
function vwUrl(layer, ext){
  return 'https://api.vworld.kr/req/wmts/1.0.0/'+VWORLD_KEY+'/'+layer+
         '/{z}/{y}/{x}.'+(ext||'png');
}
const ATTR_OSM = '&copy; OpenStreetMap contributors';
const ATTR_VW  = '&copy; <a href="https://www.vworld.kr" target="_blank" rel="noopener">국토교통부 브이월드</a>';

let baseMode='base', satDead=false, osmTiles, satGroup;

/* 두 자리 사이의 거리 (m) */
function distM(a, b){
  if(!a || !b || a.lat==null || b.lat==null) return Infinity;
  const R = 6371000, toRad = d=>d*Math.PI/180;
  const dLat = toRad(b.lat-a.lat), dLng = toRad(b.lng-a.lng);
  const la1 = toRad(a.lat), la2 = toRad(b.lat);
  const x = Math.sin(dLat/2)**2 + Math.cos(la1)*Math.cos(la2)*Math.sin(dLng/2)**2;
  return 2*R*Math.asin(Math.sqrt(x));
}

function pinIcon(grade, big, count){
  const col = grade==='g' ? '#1b8a4b' : grade==='w' ? '#c08a0a' : '#c0392b';
  const w = big?36:30, h = big?46:38;
  const n = count||1;
  // 개수는 있는 그대로 보여준다. 자릿수가 늘면 글자만 작게 한다.
  const digits = String(n).length;
  const fs = digits<=2 ? 10 : (digits===3 ? 8 : 6.6);
  const inner = (n>1)
    ? '<circle cx="15" cy="13.6" r="8" fill="#fff"/>'+
      '<text x="15" y="'+(13.6+fs*0.36)+'" text-anchor="middle" font-size="'+fs+'" '+
      'font-weight="700" font-family="sans-serif" fill="'+col+'">'+n+'</text>'
    : '<circle cx="15" cy="13.6" r="4.6" fill="#fff"/>';
  const svg =
    '<svg class="pinico" width="'+w+'" height="'+h+'" viewBox="0 0 30 38" '+
    'xmlns="http://www.w3.org/2000/svg">'+
    '<path d="M15 1C7.8 1 2 6.8 2 14c0 9.2 13 23 13 23s13-13.8 13-23C28 6.8 22.2 1 15 1z" '+
    'fill="'+col+'" stroke="#fff" stroke-width="2.2"/>'+ inner +'</svg>';
  return L.divIcon({
    html:svg, className:'', iconSize:[w,h],
    iconAnchor:[w/2,h], popupAnchor:[0,-h+6]
  });
}

function initMap(){
  map = L.map('map', {
    center:[36.3504,127.3845], zoom:11, minZoom:3, maxZoom:19,
    zoomControl:true, attributionControl:true
  });

  osmTiles = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom:19, maxNativeZoom:18, minZoom:3, attribution:ATTR_OSM
  });
  const vwSat   = L.tileLayer(vwUrl('Satellite','jpeg'),
                   {maxZoom:19, minZoom:6, attribution:ATTR_VW, zIndex:1});
  const vwLabel = L.tileLayer(vwUrl('Hybrid'), {maxZoom:19, minZoom:6, zIndex:2});
  satGroup = L.layerGroup([vwSat, vwLabel]);
  osmTiles.addTo(map);

  // 위성이 응답하지 않으면 단추를 숨긴다
  let satErr=0;
  vwSat.on('tileerror', ()=>{
    if(++satErr>8 && !satDead){ satDead=true; setBase('base'); updBaseBtn(); }
  });

  const ctl = L.control({position:'topright'});
  ctl.onAdd = function(){
    const d = L.DomUtil.create('div','leaflet-bar basectl');
    d.innerHTML = '<a href="#" id="baseToggle" role="button">위성</a>';
    L.DomEvent.disableClickPropagation(d);
    L.DomEvent.on(d,'click', function(e){
      L.DomEvent.preventDefault(e);
      setBase(baseMode==='base' ? 'sat' : 'base');
    });
    return d;
  };
  ctl.addTo(map);

  markerLayer = L.layerGroup().addTo(map);

  // 화면 크기가 나중에 바뀌는 폰을 위해 다시 재어준다
  window.addEventListener('resize', ()=>setTimeout(()=>map.invalidateSize(),120));
  setTimeout(()=>map.invalidateSize(), 300);
}

function setBase(m){
  if(m==='sat' && satDead) return;
  baseMode = m;
  if(m==='sat'){ map.removeLayer(osmTiles); satGroup.addTo(map); }
  else { if(map.hasLayer(satGroup)) map.removeLayer(satGroup); osmTiles.addTo(map); }
  updBaseBtn();
}
function updBaseBtn(){
  const a = document.getElementById('baseToggle');
  if(!a) return;
  a.textContent = (baseMode==='base') ? '위성' : '일반';
  a.style.display = satDead ? 'none' : '';
}

/* 내 위치 보여주기 */
function showMe(fix){
  if(!fix || !map) return;
  const ll = [fix.lat, fix.lng];
  if(!meMarker){
    meMarker = L.circleMarker(ll, {
      radius:7, color:'#fff', weight:2.5, fillColor:'#1f6f6b', fillOpacity:1
    }).addTo(map);
  } else meMarker.setLatLng(ll);
}

/* 지도에 기록 핀 찍기 */
function drawPins(list){
  if(!markerLayer) return;
  markerLayer.clearLayers();

  // 가까운 자리의 기록은 한 핀으로 묶는다. 좌표를 반올림하지 않고 실제 거리로 잰다.
  // GPS 는 같은 자리에서도 몇 미터씩 흔들려서, 반올림으로 묶으면 자꾸 갈라진다.
  const GROUP_M = 30;
  const groups = [];
  list.forEach(r=>{
    if(r.lat==null) return;
    let put = null;
    for(const g of groups){
      if(distM(g[0], r) <= GROUP_M){ put = g; break; }
    }
    if(put) put.push(r); else groups.push([r]);
  });

  groups.forEach(g=>{
    g.sort((a,b)=>a.createdAt-b.createdAt);     // 찍은 순서대로
    const head = g[0];
    const m = L.marker([head.lat,head.lng],
                       {icon:pinIcon(accGrade(head.acc), false, g.length)});
    m.on('click', ()=>{ if(g.length===1) openRec(head.id); else openGroup(g); });
    markerLayer.addLayer(m);
  });
}

/* 한 자리에 여러 개가 있을 때 고르는 창 */
function openGroup(g){
  clearSheetUrls();
  $('#sheetTitle').textContent = '이 자리의 기록 '+g.length+'개';
  const body = $('#sheetBody');
  body.innerHTML = '';
  const box = el('div');
  box.style.cssText = 'padding:6px 0 10px;';
  g.forEach((r,idx)=>{
    const c = el('div','card');
    const tb = el('div','thbox');
    const m0 = (r.media||[])[0];
    const img = el('img','th');
    const t0 = m0 ? thumbBlob(m0) : null;
    if(t0){ const u=URL.createObjectURL(t0); sheetUrls.push(u); img.src=u; }
    tb.appendChild(img);
    const no = el('div','vmark');
    no.textContent = (idx+1)+'번째';
    no.style.cssText = 'left:3px;right:auto;top:3px;bottom:auto;';
    tb.appendChild(no);
    const n = (r.media||[]).length;
    if(n>1){ const b=el('div','vmark'); b.textContent=n+'개'; tb.appendChild(b); }
    c.appendChild(tb);
    const bd = el('div','bd');
    const dt = el('div','dt'); dt.textContent = fmtDT(r.createdAt); bd.appendChild(dt);
    const mm = el('div', r.memo? 'mm':'mm none');
    mm.textContent = r.memo || '메모 없음'; bd.appendChild(mm);
    const me = el('div','meta');
    const a = el('span','acc '+accGrade(r.acc)); a.textContent = accText(r.acc);
    me.appendChild(a); bd.appendChild(me);
    c.appendChild(bd);
    c.appendChild(delBtn(r));
    c.onclick = ()=>openRec(r.id);
    box.appendChild(c);
  });
  body.appendChild(box);
  try{ history.pushState({v:'group'},''); }catch(e){}
  $('#sheet').classList.add('on');
}
</script>
<script>
/* ── 촬영 화면 ─────────────────────────────────────────────────── */
const CAM = (()=>{
  let stream=null, mode='photo', shots=[], rec=null, recChunks=[],
      recStart=0, recTimer=null, busy=false;

  const cv = el('canvas');   // 그림 뜨기용 (화면에 안 붙인다)

  function gpsPaint(fix){
    const dot=$('#gpsDot'), txt=$('#gpsTxt'), note=$('#gpsNote');
    const er = GPS.err();
    if(!fix){
      if(er && er.code===1){
        dot.className='b'; txt.textContent='위치 막힘';
        note.style.display='';
        note.textContent='이 브라우저에서 위치가 막혀 있습니다. 주소창 왼쪽 아이콘을 눌러 위치를 허용해 주십시오. 지금 찍으면 위치 없이 기록됩니다.';
        return;
      }
      dot.className=''; txt.textContent='위치 찾는 중';
      note.style.display= er ? '' : 'none';
      if(er) note.textContent='위치를 아직 받지 못했습니다. 하늘이 트인 쪽으로 나가 보십시오.';
      return;
    }
    const g = accGrade(fix.acc);
    dot.className = g;
    txt.textContent = accText(fix.acc);
    if(g==='g'){ note.style.display='none'; }
    else {
      note.style.display='';
      note.textContent = (g==='w')
        ? '좌표를 더 좁히는 중입니다. 몇 초 기다리면 숫자가 줄어듭니다.'
        : '위치가 넓게 잡혔습니다. 잠깐 기다리거나 하늘이 트인 쪽으로 몇 걸음 나가 보십시오. 지금 찍어도 기록은 남고, 오차가 함께 저장됩니다.';
    }
  }

  async function startStream(){
    if(stream) return;          // 이미 켜져 있으면 그대로 쓴다 (권한을 다시 묻지 않게)
    // 사진과 영상이 한 카메라를 같이 쓴다. 모드를 오갈 때 껐다 켜지 않는다.
    const want = {
      video:{ facingMode:{ideal:'environment'},
              width:{ideal:1920}, height:{ideal:1080},
              frameRate:{ideal:30, max:30} },
      audio:true
    };
    try{
      stream = await navigator.mediaDevices.getUserMedia(want);
    }catch(e){
      try{  // 소리까지는 못 주겠다고 하면 그림만이라도
        stream = await navigator.mediaDevices.getUserMedia(
          {video:{facingMode:{ideal:'environment'}}, audio:false});
      }catch(e2){ throw e2; }
    }
    const v = $('#camVideo');
    v.srcObject = stream;
    await v.play().catch(()=>{});
  }
  function stopStream(){
    if(stream){ stream.getTracks().forEach(t=>t.stop()); stream=null; }
    $('#camVideo').srcObject = null;
  }

  function showErr(msg){
    $('#camErrMsg').textContent = msg;
    $('#camErr').classList.add('on');
  }

  async function open(){
    clearTimeout(idleTimer);
    shots=[]; liveRecId=null; paintShots();
    $('#cam').classList.add('on');
    $('#camErr').classList.remove('on');
    GPS.reset(); GPS.start(); GPS.on(gpsPaint); gpsPaint(GPS.current());
    try{ await startStream(); }
    catch(e){
      let m = '카메라를 열 수 없습니다.';
      if(e && (e.name==='NotAllowedError'||e.name==='SecurityError'))
        m = '카메라 권한이 막혀 있습니다. 브라우저 설정에서 이 주소의 카메라를 허용해 주십시오.';
      else if(e && e.name==='NotFoundError') m = '쓸 수 있는 카메라를 찾지 못했습니다.';
      else if(location.protocol!=='https:' && location.hostname!=='localhost')
        m = '카메라는 https 주소에서만 열립니다.';
      showErr(m);
    }
  }
  let idleTimer = null;
  function close(){
    if(rec && rec.state==='recording'){ try{ rec.stop(); }catch(e){} }
    clearInterval(recTimer); recTimer=null;
    $('#recChip').classList.remove('on');
    GPS.off(gpsPaint);
    liveRecId = null;                        // 닫으면 묶음이 끝난다
    // 카메라는 바로 끄지 않는다. 끄면 다시 열 때 권한을 또 묻는 폰이 있다.
    // 3분 동안 다시 안 쓰면 그때 끈다.
    clearTimeout(idleTimer);
    idleTimer = setTimeout(()=>{ stopStream(); }, 180000);
    $('#cam').classList.remove('on');
    shots.forEach(s=>{ if(s.thumbUrl) URL.revokeObjectURL(s.thumbUrl); });
    shots=[];
    $('#shutter').classList.remove('rec');
  }

  function paintShots(){
    const box=$('#shots'); box.innerHTML='';
    shots.forEach((s,i)=>{
      const w=el('div','sh');
      const img=el('img'); img.src=s.thumbUrl; w.appendChild(img);
      if(s.type==='video'){
        const b=el('div','vb'); b.textContent=dur(s.dur); w.appendChild(b);
      }
      if(s.recId){
        w.title='메모 적기';
        w.onclick=()=>{ close(); openRec(s.recId); };
        const mk=el('div','vb');
        mk.textContent='메모';
        mk.style.cssText='left:auto;right:2px;top:2px;bottom:auto;background:rgba(31,111,107,.92);';
        w.appendChild(mk);
      }
      box.appendChild(w);
    });
    $('#camDone').classList.add('on');
  }

  function makeThumb(srcEl, w, h){
    const max=200;
    const sc = Math.min(max/w, max/h, 1);
    cv.width = Math.max(1,Math.round(w*sc));
    cv.height= Math.max(1,Math.round(h*sc));
    cv.getContext('2d').drawImage(srcEl,0,0,cv.width,cv.height);
    return new Promise(res=>cv.toBlob(res,'image/jpeg',0.72));
  }

  /* 사진 크기는 폰에 맡긴다.
     먼저 카메라가 주는 그대로 담아 보고, 그 폰이 버거워하면 한 단계씩 낮춘다.
     한 번 성공한 크기는 기억해 두었다가 다음부터 거기서 시작한다. */
  let photoCap = 0;                     // 0 이면 '카메라 그대로'
  const CAP_STEPS = [0, 3264, 2560, 2048, 1600, 1280];

  async function grabAt(v, vw, vh, cap){
    const sc = cap ? Math.min(cap/Math.max(vw,vh), 1) : 1;
    const w = Math.max(1, Math.round(vw*sc)), h = Math.max(1, Math.round(vh*sc));
    cv.width=w; cv.height=h;
    cv.getContext('2d').drawImage(v,0,0,w,h);
    const blob = await new Promise(res=>{ try{ cv.toBlob(res,'image/jpeg',0.92); }catch(e){ res(null); } });
    return blob && blob.size ? {blob, w, h} : null;
  }

  async function takePhoto(){
    if(busy || !stream) return;
    busy=true;
    const sh = $('#shutter');
    sh.disabled = true;                       // 두 번 눌리지 않게
    const fl = $('#flash');
    fl.classList.add('on');                   // 누른 그 순간 화면이 한 번 번쩍인다
    setTimeout(()=>fl.classList.remove('on'), 90);
    try{
      const v=$('#camVideo');
      const vw=v.videoWidth, vh=v.videoHeight;
      if(!vw||!vh){ toast('카메라가 아직 준비되지 않았습니다. 잠시 뒤 다시 눌러 주십시오.'); return; }

      // 이 폰이 받아주는 가장 큰 크기로 담는다
      let got = null;
      const start = CAP_STEPS.indexOf(photoCap);
      for(let k = (start<0 ? 0 : start); k < CAP_STEPS.length; k++){
        got = await grabAt(v, vw, vh, CAP_STEPS[k]);
        if(got){ photoCap = CAP_STEPS[k]; break; }
      }
      if(!got){
        toast('사진이 담기지 않았습니다. 한 번 더 눌러 주십시오.', 3000); return;
      }
      const thumb = await makeThumb(v,vw,vh);
      if(!thumb){ toast('사진이 담기지 않았습니다. 한 번 더 눌러 주십시오.', 3000); return; }

      const fix = GPS.current();
      const shot = {type:'photo', blob:got.blob, size:got.blob.size, thumb,
                    thumbUrl:URL.createObjectURL(thumb), w:got.w, h:got.h, fix};
      shots.push(shot);
      paintShots();
      await saveShot(shot);          // 찍는 즉시 저장
      paintShots();
    }catch(e){
      toast('사진을 찍지 못했습니다: '+(e && e.message ? e.message : ''), 3600);
    }finally{
      busy=false;
      const b=$('#shutter'); if(b) b.disabled=false;   // 어떤 경우에도 단추를 되살린다
    }
  }

  // 형식을 우리가 고르지 않고 브라우저에 맡긴다.
  // mp4 를 억지로 시키면 녹화는 되는데 그 브라우저가 못 여는 일이 생긴다.
  function pickMime(){ return ''; }

  function startRec(){
    if(!stream || !window.MediaRecorder){ toast('이 브라우저는 영상 촬영을 지원하지 않습니다.'); return; }
    const mime = pickMime();
    try{
      rec = new MediaRecorder(stream, {videoBitsPerSecond:8000000});
    }catch(e){ toast('영상 촬영을 시작할 수 없습니다.'); return; }
    recChunks=[];
    rec.ondataavailable = e=>{ if(e.data && e.data.size) recChunks.push(e.data); };
    rec.onstop = async ()=>{
      clearInterval(recTimer); recTimer=null;
      $('#recChip').classList.remove('on');
      $('#shutter').classList.remove('rec');
      const sec = Math.max(1, Math.round((Date.now()-recStart)/1000));
      const realType = (rec && rec.mimeType) || (recChunks[0] && recChunks[0].type) || 'video/webm';
      const blob = new Blob(recChunks, {type: realType});
      recChunks=[];
      if(!blob.size){ toast('영상이 비어 있습니다.'); return; }
      const v=$('#camVideo');
      const thumb = await makeThumb(v, v.videoWidth||640, v.videoHeight||480);
      const fix = GPS.current();
      const shot = {type:'video', blob, size:blob.size, thumb,
                    thumbUrl:URL.createObjectURL(thumb), dur:sec,
                    mime: blob.type, fix};
      shots.push(shot);
      paintShots();
      await saveShot(shot);          // 찍는 즉시 저장
      paintShots();
    };
    rec.start(1000);
    recStart = Date.now();
    $('#shutter').classList.add('rec');
    $('#recChip').classList.add('on');
    $('#recTime').textContent = '0:00';
    recTimer = setInterval(()=>{
      const s = Math.floor((Date.now()-recStart)/1000);
      $('#recTime').textContent = dur(s);
      if(s >= VIDEO_MAX){ toast('3분이 되어 멈췄습니다.'); stopRec(); }
    }, 250);
  }
  function stopRec(){
    if(rec && rec.state==='recording'){ try{ rec.stop(); }catch(e){} }
  }

  function setMode(m){
    if(mode===m) return;
    if(rec && rec.state==='recording') return;
    mode=m;                      // 카메라는 그대로 두고 단추만 바꾼다
    $('#mPhoto').classList.toggle('on', m==='photo');
    $('#mVideo').classList.toggle('on', m==='video');
    $('#shutter').classList.remove('rec');
  }

  /* 찍는 즉시 저장한다.
     촬영 화면을 열어 둔 채 같은 자리에서 더 찍으면, 새 기록을 만들지 않고
     아까 만든 기록에 이어 붙인다. 닫았다 다시 열면 새 기록이 시작된다. */
  let liveRecId = null;

  function metersBetween(a, b){
    if(!a || !b) return Infinity;
    const R = 6371000, toRad = d=>d*Math.PI/180;
    const dLat = toRad(b.lat-a.lat), dLng = toRad(b.lng-a.lng);
    const la1 = toRad(a.lat), la2 = toRad(b.lat);
    const x = Math.sin(dLat/2)**2 + Math.cos(la1)*Math.cos(la2)*Math.sin(dLng/2)**2;
    return 2*R*Math.asin(Math.sqrt(x));
  }

  async function addToLive(shot, fix){
    if(!liveRecId) return false;
    const rec = await DB.get(liveRecId);
    if(!rec) { liveRecId = null; return false; }
    // 자리를 옮겼으면 새 기록으로 (50m 넘게)
    if(fix && rec.lat!=null && metersBetween({lat:rec.lat,lng:rec.lng}, fix) > 50) return false;
    rec.media.push({
      type: shot.type,
      mime: (shot.mime || (shot.blob && shot.blob.type) || ''),
      size: shot.size,
      dur:  (shot.dur||null),
      buf:      await shot.blob.arrayBuffer(),
      thumbBuf: shot.thumb ? await shot.thumb.arrayBuffer() : null
    });
    // 더 정확한 위치를 받았으면 바꿔 끼운다
    if(fix && (rec.acc==null || fix.acc < rec.acc)){
      rec.lat=fix.lat; rec.lng=fix.lng; rec.acc=fix.acc;
      rec.alt=fix.alt; rec.altAcc=fix.altAcc; rec.heading=fix.heading;
    }
    await DB.put(rec);
    const check = await DB.get(rec.id);
    if(!check) throw new Error('저장이 되돌려졌습니다');
    shot.recId = rec.id;
    await loadRecords();
    toast('이 자리 기록에 더했습니다 (' + rec.media.length + '개)', 2200);
    autoPush(rec.id);
    return true;
  }

  // 사진만 들어 있는 기록은 로그인돼 있으면 조용히 올린다.
  // 영상은 용량이 커서 손님이 고를 때만 올린다.
  function autoPush(id){
    try{
      if(typeof Drive==='undefined' || !Drive.signedIn()) return;
      setTimeout(async ()=>{
        try{
          const r = await DB.get(id);
          if(!r || !r.media || !r.media.length) return;
          if(r.media.every(m=>m.driveId)) return;
          await Drive.pushRecord(r);
          await Drive.writeIndex();
          await loadRecords();
        }catch(e){}
      }, 400);
    }catch(e){}
  }

  async function saveShot(shot){
    let fix = shot.fix;
    if(!fix){ fix = await GPS.once(7000); }

    // 먼저 이어 붙일 수 있으면 붙인다
    try{
      if(await addToLive(shot, fix)) return true;
    }catch(e){
      toast('저장하지 못했습니다: '+((e&&(e.name||e.message))||''), 5000);
      return false;
    }

    const now = Date.now();
    const rec = {
      id: 'r'+now+'_'+Math.random().toString(36).slice(2,7),
      createdAt: now,
      lat: fix? fix.lat : null,
      lng: fix? fix.lng : null,
      acc: fix? fix.acc : null,
      alt: fix? fix.alt : null,
      altAcc: fix? fix.altAcc : null,
      heading: fix? fix.heading : null,
      origLat:null, origLng:null, moved:false,
      memo: '',
      media: []
    };
    try{
      rec.media = [{
        type: shot.type,
        mime: (shot.mime || (shot.blob && shot.blob.type) || ''),
        size: shot.size,
        dur:  (shot.dur||null),
        buf:      await shot.blob.arrayBuffer(),
        thumbBuf: shot.thumb ? await shot.thumb.arrayBuffer() : null
      }];
      await DB.put(rec);
      const check = await DB.get(rec.id);
      if(!check) throw new Error('저장이 되돌려졌습니다');
      shot.recId = rec.id;
      liveRecId = rec.id;                   // 이 자리에서 더 찍으면 여기에 붙인다
      await loadRecords();
      toast('저장했습니다. 메모는 기록을 눌러 적으시면 됩니다.', 2600);
      autoPush(rec.id);
      return true;
    }catch(e){
      const nm = (e && (e.name||'')) + '';
      if(nm.indexOf('Quota')>=0 || nm.indexOf('QUOTA')>=0){
        await dialog({
          title:'폰 저장 공간이 찼습니다',
          text:'이 브라우저가 쓸 수 있는 공간을 다 썼습니다. 기록을 내려받아 보관하신 뒤, 오래된 기록을 지우면 다시 저장됩니다.',
          yes:'알겠습니다', noHide:true
        });
      } else {
        toast('저장하지 못했습니다: '+((e&&(e.name||e.message))||''), 5000);
      }
      return false;
    }
  }

  async function save(){
    if(!shots.length) return;
    let memo='';
    const ok = await dialog({
      title:'기록 저장',
      text:'사진·영상 '+shots.length+'개를 한 기록으로 저장합니다.',
      html:'<label for="mIn">메모</label>'+
           '<textarea id="mIn" rows="4" style="width:100%;border:1px solid var(--line);'+
           'border-radius:10px;padding:10px;font-family:inherit;font-size:14px;'+
           'line-height:1.6;background:#fdfcfa;color:var(--ink);" '+
           'placeholder="본 것, 느낀 것을 적어 두십시오. 비워 두어도 됩니다."></textarea>',
      yes:'저장', no:'더 찍기',
      after:()=>{ setTimeout(()=>{ const t=$('#mIn'); if(t) t.focus(); }, 80); }
    });
    if(!ok) return;
    memo = ($('#mIn') && $('#mIn').value || '').trim();

    // 여러 장 가운데 가장 정확한 위치를 그 기록의 위치로 쓴다
    let fix=null;
    shots.forEach(s=>{ if(s.fix && (!fix || s.fix.acc < fix.acc)) fix = s.fix; });

    // 한 장도 위치를 못 받았으면 여기서 다시 한 번 받아본다
    if(!fix){
      toast('위치를 받는 중입니다. 잠시만 기다려 주십시오.', 9000);
      fix = await GPS.once(9000);
      if(!fix){
        const er = GPS.err();
        const why = (er && er.code===1)
          ? '이 브라우저에서 위치가 막혀 있습니다.'
          : '위치를 받지 못했습니다. 실내이거나 신호가 약한 곳일 수 있습니다.';
        const go = await dialog({
          title:'위치 없이 저장할까요',
          text: why + ' 위치 없이 저장하면 지도에 뜨지 않고 기록 목록에만 남습니다.',
          yes:'위치 없이 저장', no:'그만두기'
        });
        if(!go) return;
      }
    }

    const now = Date.now();
    const recObj = {
      id: 'r'+now+'_'+Math.random().toString(36).slice(2,7),
      createdAt: now,
      lat: fix? fix.lat : null,
      lng: fix? fix.lng : null,
      acc: fix? fix.acc : null,
      alt: fix? fix.alt : null,          // 고도 — 저장만 하고 화면에는 안 띄운다
      altAcc: fix? fix.altAcc : null,
      heading: fix? fix.heading : null,  // 방위 — 같음
      origLat:null, origLng:null, moved:false,
      memo: memo,
      media: []
    };
    try{
      recObj.media = await Promise.all(shots.map(async s=>({
        type: s.type,
        mime: (s.mime || (s.blob && s.blob.type) || ''),
        size: s.size,
        dur:  (s.dur||null),
        buf:      await s.blob.arrayBuffer(),
        thumbBuf: s.thumb ? await s.thumb.arrayBuffer() : null
      })));
      if(!recObj.media.length) throw new Error('담긴 사진·영상이 없습니다');
      await DB.put(recObj);
      const check = await DB.get(recObj.id);          // 정말 들어갔는지 눈으로 확인
      if(!check) throw new Error('저장이 되돌려졌습니다');
      shots.forEach(s=>{ if(s.thumbUrl) URL.revokeObjectURL(s.thumbUrl); });
      shots=[]; paintShots();
      await loadRecords();
      close();
      toast('기록을 저장했습니다.');
      if(recObj.lat!=null){ goMap(); map.setView([recObj.lat,recObj.lng], 16); }
    }catch(e){
      const nm = (e && (e.name||'')) + '';
      if(nm.indexOf('Quota')>=0 || nm.indexOf('QUOTA')>=0){
        await dialog({
          title:'폰 저장 공간이 찼습니다',
          text:'이 브라우저가 쓸 수 있는 공간을 다 썼습니다. 기록을 내려받아 보관하신 뒤, 오래된 기록을 지우면 다시 저장됩니다.',
          yes:'알겠습니다', noHide:true
        });
      } else {
        toast('저장하지 못했습니다: '+(e && (e.name||e.message) ? (e.name||'')+' '+(e.message||'') : ''), 5000);
      }
    }
  }

  return {open, close, takePhoto, startRec, stopRec, setMode, save,
          release:()=>{ clearTimeout(idleTimer); stopStream(); },
          isRec:()=>!!(rec && rec.state==='recording'),
          mode:()=>mode};
})();

/* ── 목록 ──────────────────────────────────────────────────────── */
let thumbUrls = [];
function clearThumbUrls(){ thumbUrls.forEach(u=>URL.revokeObjectURL(u)); thumbUrls=[]; }

function filtered(){
  const q = ($('#srch').value||'').trim().toLowerCase();
  const f = $('#dFrom').value, t = $('#dTo').value;
  const fMs = f ? new Date(f+'T00:00:00').getTime() : null;
  const tMs = t ? new Date(t+'T23:59:59.999').getTime() : null;
  return records.filter(r=>{
    if(q && !(r.memo||'').toLowerCase().includes(q)) return false;
    if(fMs!=null && r.createdAt < fMs) return false;
    if(tMs!=null && r.createdAt > tMs) return false;
    return true;
  });
}

function renderList(){
  const list = filtered();
  clearThumbUrls();
  const box = $('#cards'); box.innerHTML='';
  $('#cnt').textContent = records.length
    ? (list.length===records.length ? '기록 '+records.length+'개'
       : '기록 '+list.length+'개 (전체 '+records.length+'개 가운데)')
    : '';
  if(!records.length){
    const e=el('div','empty');
    e.innerHTML='<div class="big">📍</div>아직 기록이 없습니다.<br>아래 가운데 단추를 눌러 첫 기록을 남겨 보십시오.';
    box.appendChild(e);
    drawPins([]); return;
  }
  if(!list.length){
    const e=el('div','empty');
    e.innerHTML='<div class="big">🔍</div>찾는 조건에 맞는 기록이 없습니다.';
    box.appendChild(e);
    drawPins([]); return;
  }
  list.forEach(r=>{
    const c = el('div','card');
    const tb = el('div','thbox');
    const m0 = (r.media||[])[0];
    const img = el('img','th');
    const t0 = m0 ? thumbBlob(m0) : null;
    if(t0){ const u=URL.createObjectURL(t0); thumbUrls.push(u); img.src=u; }
    tb.appendChild(img);
    const vids = (r.media||[]).filter(m=>m.type==='video').length;
    const n = (r.media||[]).length;
    if(n>1){ const b=el('div','vmark'); b.textContent=n+'개'; tb.appendChild(b); }
    else if(vids){ const b=el('div','vmark'); b.textContent='영상'; tb.appendChild(b); }
    c.appendChild(tb);

    const bd = el('div','bd');
    const dt = el('div','dt'); dt.textContent = fmtDT(r.createdAt); bd.appendChild(dt);
    const mm = el('div', r.memo? 'mm':'mm none');
    mm.textContent = r.memo || '메모 없음'; bd.appendChild(mm);
    const me = el('div','meta');
    const a = el('span','acc '+accGrade(r.acc)); a.textContent = accText(r.acc);
    me.appendChild(a);
    if(r.moved){ const s=el('span'); s.textContent='위치 손봄'; me.appendChild(s); }
    if((r.media||[]).length && r.media.every(m=>m.driveId)){
      const u=el('span','up'); u.textContent='드라이브'; me.appendChild(u);
    }
    if(vids){ const s=el('span'); s.textContent='영상 '+vids+'개'; me.appendChild(s); }
    bd.appendChild(me);
    c.appendChild(bd);
    c.appendChild(delBtn(r));
    c.onclick = ()=>openRec(r.id);
    box.appendChild(c);
  });
  drawPins(list);
}

/* ── 기록 크게 보기 ────────────────────────────────────────────── */
let sheetUrls = [], curRec = null;
function clearSheetUrls(){ sheetUrls.forEach(u=>URL.revokeObjectURL(u)); sheetUrls=[]; }

async function openRec(id){
  const r = await DB.get(id);
  if(!r){ toast('기록을 찾지 못했습니다.'); return; }
  curRec = r;
  $('#sheetTitle').textContent = fmtDT(r.createdAt);
  const body = $('#sheetBody');
  clearSheetUrls();
  body.innerHTML = '';

  const media = r.media||[];
  if(media.length){
    const wrap = el('div'); wrap.id='bigWrap';
    body.appendChild(wrap);
    const nav = el('div'); nav.id='bigNav';
    let cur = 0;
    const show = i=>{
      cur = i;
      wrap.innerHTML='';
      const m = media[i];
      let b = mediaBlob(m);
      if((!b || !b.size) && m.driveId){
        const p=el('div');
        p.style.cssText='color:#bbb;padding:26px 18px;font-size:13.5px;text-align:center;';
        p.textContent='드라이브에서 받는 중…';
        wrap.appendChild(p);
        if(typeof Drive!=='undefined' && Drive.signedIn()){
          Drive.fetchMedia(r, i).then(()=>{ if(cur===i) show(i); })
               .catch(()=>{ p.textContent='드라이브에서 받지 못했습니다.'; });
        } else {
          p.textContent='이 사진은 드라이브에 있습니다. 로그인하면 볼 수 있습니다.';
        }
        return;
      }
      if(!b || !b.size){
        const p=el('div');
        p.style.cssText='color:#bbb;padding:26px 18px;font-size:13.5px;line-height:1.6;text-align:center;';
        p.textContent='이 사진·영상은 기기에서 꺼내지 못했습니다.';
        wrap.appendChild(p);
        return;
      }
      const u = URL.createObjectURL(b); sheetUrls.push(u);
      if(m.type==='video'){
        const v=el('video'); v.src=u; v.controls=true; v.playsInline=true;
        v.onerror=()=>{ wrap.innerHTML='<div style="color:#bbb;padding:26px;text-align:center;font-size:13.5px">영상을 열지 못했습니다.</div>'; };
        wrap.appendChild(v);
      } else {
        const im=el('img'); im.src=u;
        im.onerror=()=>{ wrap.innerHTML='<div style="color:#bbb;padding:26px;text-align:center;font-size:13.5px">사진을 열지 못했습니다.</div>'; };
        wrap.appendChild(im);
      }
      [...nav.children].forEach((b,j)=>b.classList.toggle('on', j===i));

      const sv = el('button','bigSave');
      sv.textContent = (m.type==='video' ? '영상 저장' : '사진 저장');
      sv.onclick = e=>{ e.stopPropagation(); saveToPhone(r, i); };
      wrap.appendChild(sv);

      const del = el('button','bigDel');
      del.textContent = (m.type==='video' ? '영상 지우기' : '사진 지우기');
      del.onclick = async e=>{
        e.stopPropagation();
        await removeMedia(r, i);
      };
      wrap.appendChild(del);

      if(media.length>1){
        const c = el('div','bigCount');
        c.textContent = (i+1)+' / '+media.length;
        wrap.appendChild(c);
        const L = el('button','bigArrow l'); L.textContent='‹';
        const R = el('button','bigArrow r'); R.textContent='›';
        L.disabled = (i===0); R.disabled = (i===media.length-1);
        L.onclick = e=>{ e.stopPropagation(); if(cur>0) show(cur-1); };
        R.onclick = e=>{ e.stopPropagation(); if(cur<media.length-1) show(cur+1); };
        wrap.appendChild(L); wrap.appendChild(R);
      }
    };

    // 손가락으로 좌우로 밀어 넘기기
    if(media.length>1){
      let x0=null, y0=null;
      wrap.addEventListener('touchstart', e=>{
        if(e.touches.length!==1) { x0=null; return; }
        x0 = e.touches[0].clientX; y0 = e.touches[0].clientY;
      }, {passive:true});
      wrap.addEventListener('touchend', e=>{
        if(x0==null) return;
        const t = e.changedTouches[0];
        const dx = t.clientX - x0, dy = t.clientY - y0;
        x0 = null;
        if(Math.abs(dx) < 45 || Math.abs(dx) < Math.abs(dy)) return;  // 세로로 넘긴 건 무시
        if(dx < 0 && cur < media.length-1) show(cur+1);
        else if(dx > 0 && cur > 0) show(cur-1);
      }, {passive:true});
    }
    media.forEach((m,i)=>{
      const b=el('button');
      const im=el('img');
      const tb = thumbBlob(m);
      if(tb){ const tu=URL.createObjectURL(tb); sheetUrls.push(tu); im.src=tu; }
      b.appendChild(im);
      b.onclick=()=>show(i);
      nav.appendChild(b);
    });
    if(media.length>1) body.appendChild(nav);
    show(0);
  }

  // 위치
  const s1 = el('div','sec');
  s1.innerHTML = '<h3>위치</h3>';
  const kv = (k,v)=>{
    const d=el('div','kv');
    d.innerHTML='<span class="k">'+k+'</span><span class="v">'+v+'</span>';
    return d;
  };
  if(r.lat!=null){
    const addrRow = kv('주소', r.addr ? r.addr : '<span style="color:#a8b2b0">받는 중…</span>');
    s1.appendChild(addrRow);
    s1.appendChild(kv('좌표', r.lat.toFixed(6)+', '+r.lng.toFixed(6)));
    s1.appendChild(kv('오차', '<span class="acc '+accGrade(r.acc)+'">'+accText(r.acc)+'</span>'));
    if(!r.addr){
      addressOf(r.lat, r.lng).then(async a=>{
        if(!a) {
          const v = addrRow.querySelector('.v');
          if(v) v.innerHTML = '<span style="color:#a8b2b0">주소를 찾지 못했습니다</span>';
          return;
        }
        const txt = a.road ? (a.road + (a.jibun ? '  ('+a.jibun+')' : '')) : a.jibun;
        r.addr = txt;
        try{ await DB.put(r); await loadRecords(); }catch(e){}
        const v = addrRow.querySelector('.v');
        if(v) v.textContent = txt;
      });
    }
    if(r.moved && r.origLat!=null){
      s1.appendChild(kv('원래 좌표', r.origLat.toFixed(6)+', '+r.origLng.toFixed(6)));
    }
  } else {
    s1.appendChild(kv('좌표','위치를 받지 못한 기록입니다.'));
  }
  body.appendChild(s1);

  // 메모
  const s2 = el('div','sec');
  s2.innerHTML = '<h3>메모</h3><textarea id="memoEd" placeholder="메모를 적어 두십시오."></textarea>';
  body.appendChild(s2);
  $('#memoEd').value = r.memo||'';

  const row1 = el('div','btnRow');
  const bSave = el('button','pri'); bSave.textContent='메모 저장';
  bSave.onclick = async ()=>{
    curRec.memo = $('#memoEd').value.trim();
    await DB.put(curRec); await loadRecords();
    toast('메모를 저장했습니다.');
  };
  const bFix = el('button'); bFix.textContent='핀 위치 손보기';
  bFix.onclick = ()=>startFix(curRec);
  row1.appendChild(bSave); row1.appendChild(bFix);
  body.appendChild(row1);

  const row2 = el('div','btnRow');
  const bGo = el('button'); bGo.textContent='지도에서 보기';
  bGo.onclick = ()=>{
    closeSheet();
    if(curRec.lat==null){ toast('위치가 없는 기록입니다.'); return; }
    goMap(); map.setView([curRec.lat,curRec.lng], 17);
  };
  const bDel = el('button','dng'); bDel.textContent='기록 지우기';
  bDel.onclick = async ()=>{
    const ok = await dialog({
      title:'기록을 지웁니다', text:'이 기록과 딸린 사진·영상이 함께 사라집니다. 되돌릴 수 없습니다.',
      yes:'지우기', no:'그만두기', danger:true
    });
    if(!ok) return;
    await DB.del(curRec.id); await loadRecords(); closeSheet();
    toast('기록을 지웠습니다.');
  };
  row2.appendChild(bGo); row2.appendChild(bDel);
  body.appendChild(row2);

  try{ history.pushState({v:'sheet'},''); }catch(e){}
  $('#sheet').classList.add('on');
}
/* 목록에서 기록 하나를 통째로 지우는 단추 */
function delBtn(r){
  const b = el('button','del');
  b.textContent = '✕';
  b.title = '이 기록 지우기';
  b.onclick = async e=>{
    e.stopPropagation();
    const n = (r.media||[]).length;
    const ok = await dialog({
      title:'이 기록을 지웁니다',
      text: fmtDT(r.createdAt)+'에 남긴 기록입니다. 사진·영상 '+n+'개와 메모가 함께 사라집니다. 되돌릴 수 없습니다.',
      yes:'지우기', no:'그만두기', danger:true
    });
    if(!ok) return;
    try{
      await DB.del(r.id);
      await loadRecords();
      if($('#sheet').classList.contains('on')) closeSheet();
      toast('기록을 지웠습니다.');
    }catch(err){
      toast('지우지 못했습니다: '+((err&&(err.name||err.message))||''), 4200);
    }
  };
  return b;
}

/* 보고 있는 사진·영상 한 개를 폰에 저장(또는 다른 앱으로 보내기) */
async function saveToPhone(r, i){
  const m = (r.media||[])[i];
  if(!m) return;
  const b = mediaBlob(m);
  if(!b || !b.size){ toast('아직 받아오지 못했습니다. 잠시 뒤 다시 눌러 주십시오.', 3000); return; }

  const ext = (m.type==='video') ? ((m.mime||'').includes('mp4')?'mp4':'webm') : 'jpg';
  const name = (m.name || ('지도일기_'+fileStamp(r.createdAt)+'_'+(i+1)+'.'+ext));
  const file = new File([b], name, {type: m.mime || b.type || 'application/octet-stream'});

  // 폰에서는 '공유'로 보내면 갤러리에 저장하거나 카톡으로 바로 보낼 수 있다
  try{
    if(navigator.canShare && navigator.canShare({files:[file]})){
      await navigator.share({files:[file], title:'지도일기'});
      return;
    }
  }catch(e){
    if(e && e.name === 'AbortError') return;      // 손님이 그만둔 것
  }

  // 카카오톡·인스타 같은 앱 안의 작은 브라우저는 저장을 제대로 못 한다.
  // 거기서 내려받기를 걸면 쓸데없는 안내창만 뜨므로 아예 걸지 않는다.
  const ua = navigator.userAgent || '';
  const inApp = /KAKAOTALK|NAVER\(inapp|Instagram|FBAN|FBAV|Line\//i.test(ua);
  if(inApp){
    toast('이 화면에서는 저장이 되지 않습니다. 아래 ⋮ 를 눌러 "다른 브라우저로 열기"로 여신 뒤 저장해 주십시오.', 5200);
    return;
  }

  // 그 밖에는 그냥 내려받는다
  try{
    const u = URL.createObjectURL(b);
    const a = el('a'); a.href = u; a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(u), 30000);
    toast('내려받았습니다. 폰의 "다운로드" 폴더에 있습니다.', 3400);
  }catch(e){
    toast('저장하지 못했습니다.', 3000);
  }
}

/* 기록 안에서 사진·영상 한 개만 지우기 */
async function removeMedia(r, i){
  const m = (r.media||[])[i];
  if(!m) return;
  const what = (m.type==='video' ? '영상' : '사진');
  const last = (r.media.length === 1);
  const ok = await dialog({
    title: what+'을 지웁니다',
    text: last
      ? '이 기록에 남은 마지막 '+what+'입니다. 지우면 기록도 함께 사라집니다. 되돌릴 수 없습니다.'
      : '이 '+what+' 하나만 지웁니다. 되돌릴 수 없습니다.',
    yes:'지우기', no:'그만두기', danger:true
  });
  if(!ok) return;
  try{
    if(last){
      await DB.del(r.id);
      await loadRecords();
      closeSheet();
      toast('기록을 지웠습니다.');
      return;
    }
    r.media.splice(i,1);
    await DB.put(r);
    await loadRecords();
    closeSheet();
    await openRec(r.id);
    toast(what+'을 지웠습니다. 남은 '+r.media.length+'개', 2600);
  }catch(e){
    toast('지우지 못했습니다: '+((e&&(e.name||e.message))||''), 4200);
  }
}

function closeSheet(){
  $('#sheet').classList.remove('on');
  clearSheetUrls();
  $('#sheetBody').innerHTML='';
  curRec=null;
}
window.openRec = openRec;

/* ── 핀 위치 손보기 ────────────────────────────────────────────── */
function startFix(r){
  if(r.lat==null){ toast('위치가 없는 기록은 손볼 수 없습니다.'); return; }
  closeSheet(); goMap();
  fixRec = r;
  map.setView([r.lat,r.lng], Math.max(map.getZoom(), 17));
  if(!satDead) setBase('sat');            // 위성으로 바꿔 두면 자리를 짚기 쉽다
  if(fixMarker) map.removeLayer(fixMarker);
  fixMarker = L.marker(map.getCenter(), {icon:pinIcon('w', true), interactive:false})
                .addTo(map);
  map.on('move', fixFollow);
  $('#fixBar').classList.add('on');
  $('#mapHint').style.display='none';
}
function fixFollow(){ if(fixMarker) fixMarker.setLatLng(map.getCenter()); }
function endFix(){
  map.off('move', fixFollow);
  if(fixMarker){ map.removeLayer(fixMarker); fixMarker=null; }
  $('#fixBar').classList.remove('on');
  fixRec=null;
}
async function saveFix(){
  if(!fixRec) return endFix();
  const c = map.getCenter();
  if(fixRec.origLat==null){ fixRec.origLat = fixRec.lat; fixRec.origLng = fixRec.lng; }
  fixRec.lat = c.lat; fixRec.lng = c.lng; fixRec.moved = true;
  await DB.put(fixRec);
  await loadRecords();
  endFix();
  toast('위치를 고쳤습니다. 원래 좌표도 함께 남겨 두었습니다.', 3000);
}
</script>
<script>
/* ── 내려받기 — 엑셀 한 장 + 사진·영상 폴더를 압축파일 하나로 ──── */
async function doExport(){
  if(!records.length){ toast('내려받을 기록이 없습니다.'); return; }

  const first = records[records.length-1].createdAt;
  const fd = new Date(first);
  const defFrom = fd.getFullYear()+'-'+pad(fd.getMonth()+1)+'-'+pad(fd.getDate());

  await dialog({
    title:'기록 내려받기',
    text:'엑셀 한 장과 사진·영상 폴더가 압축파일 하나로 받아집니다.',
    html:
      '<label for="exMode">받을 범위</label>'+
      '<select id="exMode">'+
        '<option value="all">전체 ('+records.length+'개)</option>'+
        '<option value="range">기간 골라 받기</option>'+
      '</select>'+
      '<div id="exRange" style="display:none">'+
        '<label for="exFrom">시작일</label><input type="date" id="exFrom" value="'+defFrom+'">'+
        '<label for="exTo">끝일</label><input type="date" id="exTo" value="'+todayStr()+'">'+
      '</div>',
    yes:'받기', no:'그만두기',
    after:()=>{
      const sel=$('#exMode');
      sel.onchange=()=>{ $('#exRange').style.display = sel.value==='range' ? '' : 'none'; };
    },
    hold: async (done)=>{
      const mode = $('#exMode').value;
      let list = records.slice();
      if(mode==='range'){
        const f=$('#exFrom').value, t=$('#exTo').value;
        const fMs = f? new Date(f+'T00:00:00').getTime() : null;
        const tMs = t? new Date(t+'T23:59:59.999').getTime() : null;
        list = list.filter(r=>(fMs==null||r.createdAt>=fMs) && (tMs==null||r.createdAt<=tMs));
      }
      if(!list.length){ dlgProg(''); toast('그 기간에는 기록이 없습니다.'); return; }

      let bytes = 0;
      list.forEach(r=>(r.media||[]).forEach(m=>bytes+=(m.size||0)));
      dlgProg('묶는 중… 0 / '+list.length+'개 ('+mb(bytes)+')');

      try{
        const zip = new JSZip();
        const folder = zip.folder('사진영상');
        const rows = [[
          '번호','날짜','시각','주소','위도','경도','오차(m)','고도(m)','고도오차(m)','방위(도)',
          '위치 손봄','원래 위도','원래 경도','메모','파일'
        ]];

        list.sort((a,b)=>a.createdAt-b.createdAt);
        for(let i=0;i<list.length;i++){
          const r = list[i];
          const d = new Date(r.createdAt);
          const stamp = fileStamp(r.createdAt);
          const names = [];
          const media = r.media||[];
          for(let j=0;j<media.length;j++){
            const m = media[j];
            let ext = 'jpg';
            if(m.type==='video'){
              ext = (m.mime||'').includes('mp4') ? 'mp4' : 'webm';
            }
            const nm = stamp + (media.length>1 ? '_'+(j+1) : '') + '.' + ext;
            const mb2 = mediaBlob(m);
            if(mb2){ names.push(nm); folder.file(nm, mb2); }
          }
          rows.push([
            i+1,
            d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()),
            pad(d.getHours())+':'+pad(d.getMinutes())+':'+pad(d.getSeconds()),
            r.addr || '',
            r.lat!=null ? Number(r.lat.toFixed(6)) : '',
            r.lng!=null ? Number(r.lng.toFixed(6)) : '',
            r.acc!=null ? Number(r.acc.toFixed(1)) : '',
            r.alt!=null ? Number(r.alt.toFixed(1)) : '',
            r.altAcc!=null ? Number(r.altAcc.toFixed(1)) : '',
            r.heading!=null ? Number(r.heading.toFixed(0)) : '',
            r.moved ? '예' : '',
            (r.moved && r.origLat!=null) ? Number(r.origLat.toFixed(6)) : '',
            (r.moved && r.origLng!=null) ? Number(r.origLng.toFixed(6)) : '',
            r.memo||'',
            names.join(', ')
          ]);
          if((i+1)%5===0 || i===list.length-1)
            dlgProg('묶는 중… '+(i+1)+' / '+list.length+'개 ('+mb(bytes)+')');
          await new Promise(r2=>setTimeout(r2,0));   // 화면이 멈추지 않게
        }

        const ws = XLSX.utils.aoa_to_sheet(rows);
        ws['!cols'] = [{wch:5},{wch:11},{wch:9},{wch:34},{wch:11},{wch:12},{wch:8},{wch:8},
                       {wch:10},{wch:8},{wch:9},{wch:11},{wch:12},{wch:44},{wch:30}];
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, '기록');
        const xl = XLSX.write(wb, {bookType:'xlsx', type:'array'});
        zip.file('기록.xlsx', xl);

        dlgProg('압축하는 중… 잠시 기다려 주십시오.');
        const out = await zip.generateAsync({type:'blob', compression:'STORE'},
          meta=>{ if(meta.percent) dlgProg('압축하는 중… '+Math.round(meta.percent)+'%'); });

        const url = URL.createObjectURL(out);
        const a = el('a');
        a.href = url;
        a.download = '지도일기_'+todayStr().replace(/-/g,'')+'.zip';
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(()=>URL.revokeObjectURL(url), 60000);
        dlgProg('');
        done(true);
        toast('내려받았습니다. 기록 '+list.length+'개 ('+mb(out.size)+')', 3600);
      }catch(e){
        dlgProg('');
        toast('내려받지 못했습니다. 기간을 좁혀 다시 해보십시오.', 3600);
      }
    }
  });
}

(async function start(){
  initMap();
  await loadRecords();

  // 첫 화면은 전국을 보여준다. 위치는 조용히 받아 두되 지도를 옮기지는 않는다.
  GPS.start();
  GPS.on(fix=>{ if(fix) showMe(fix); });

  const hint = $('#mapHint');
  if(!records.length){
    hint.innerHTML = '아래 가운데 <b>●</b> 단추를 누르면 촬영 화면이 열립니다. 찍은 자리가 그대로 지도에 남습니다.';
    hint.style.display='';
    setTimeout(()=>{ hint.style.display='none'; }, 9000);
  }

  // 저장 공간이 얼마나 남았는지 (쓸 수 있는 브라우저에서만)
  if(navigator.storage && navigator.storage.estimate){
    try{
      const q = await navigator.storage.estimate();
      if(q.quota && q.usage/q.quota > 0.85){
        toast('기기 저장 공간이 거의 찼습니다. 기록을 내려받아 두고 지워 주십시오.', 4200);
      }
      // 브라우저가 저장을 함부로 지우지 않도록 요청
      if(navigator.storage.persist) navigator.storage.persist().catch(()=>{});
    }catch(e){}
  }
})();
</script>

<script>
/* ======================================================================
   구글 로그인 + 내 드라이브에 올리기
   - 서버가 없다. 사진·영상·목록이 전부 사용자 자기 드라이브에 들어간다.
   - 권한은 drive.file 하나뿐: 이 앱이 만든 파일만 다룬다.
   ====================================================================== */
const GCLIENT_ID = '541026371687-lpvde8mc2elghdudpje7p2598dv837ah.apps.googleusercontent.com';
const GSCOPE     = 'openid email https://www.googleapis.com/auth/drive.file';
const FOLDER     = '지도일기';
const INDEX_FILE = '기록목록.json';

const Drive = (()=>{
  let token = null, tokenAt = 0, tc = null;
  let folderId = null, indexId = null;
  let me = (()=>{ try{ return localStorage.getItem('jd_me')||''; }catch(e){ return ''; } })();
  let busy = false;

  function signedIn(){ return !!token && (Date.now()-tokenAt) < 50*60*1000; }
  function hdr(){ return {Authorization:'Bearer '+token}; }

  function getToken(prompt){
    return new Promise((res,rej)=>{
      if(!window.google || !google.accounts || !google.accounts.oauth2)
        return rej(new Error('구글 로그인 준비가 아직 안 됐습니다. 잠시 뒤 다시 눌러 주십시오.'));
      if(!tc){
        tc = google.accounts.oauth2.initTokenClient({
          client_id: GCLIENT_ID, scope: GSCOPE,
          callback: r=>{
            if(r && r.access_token){ token=r.access_token; tokenAt=Date.now(); tc._ok&&tc._ok(); }
            else { tc._no&&tc._no(new Error('로그인이 취소되었습니다.')); }
          },
          error_callback: e=>{ tc._no&&tc._no(new Error('로그인이 취소되었습니다.')); }
        });
      }
      tc._ok = ()=>res(token); tc._no = rej;
      tc.requestAccessToken({prompt: prompt||''});
    });
  }

  async function api(url, opt){
    const o = Object.assign({}, opt||{});
    o.headers = Object.assign({}, o.headers||{}, hdr());
    let r = await fetch(url, o);
    if(r.status===401){                       // 표가 만료되면 조용히 새로 받는다
      await getToken('');
      o.headers = Object.assign({}, o.headers||{}, hdr());
      r = await fetch(url, o);
    }
    if(!r.ok) throw new Error('드라이브 오류 '+r.status);
    return r;
  }

  async function ensureFolder(){
    if(folderId) return folderId;
    const q = encodeURIComponent(
      "name='"+FOLDER+"' and mimeType='application/vnd.google-apps.folder' and trashed=false");
    const r = await api('https://www.googleapis.com/drive/v3/files?q='+q+'&fields=files(id,name)');
    const j = await r.json();
    if(j.files && j.files.length){ folderId = j.files[0].id; return folderId; }
    const c = await api('https://www.googleapis.com/drive/v3/files', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({name:FOLDER, mimeType:'application/vnd.google-apps.folder'})
    });
    folderId = (await c.json()).id;
    return folderId;
  }

  async function uploadBlob(blob, name, mime){
    const fid = await ensureFolder();
    const meta = {name, parents:[fid]};
    const b = new Blob([
      '--jd\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n',
      JSON.stringify(meta),
      '\r\n--jd\r\nContent-Type: '+(mime||'application/octet-stream')+'\r\n\r\n',
      blob, '\r\n--jd--'
    ], {type:'multipart/related; boundary=jd'});
    const r = await api(
      'https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id',
      {method:'POST', headers:{'Content-Type':'multipart/related; boundary=jd'}, body:b});
    return (await r.json()).id;
  }

  async function overwriteBlob(id, blob, mime){
    const r = await api(
      'https://www.googleapis.com/upload/drive/v3/files/'+id+'?uploadType=media&fields=id',
      {method:'PATCH', headers:{'Content-Type':mime||'application/octet-stream'}, body:blob});
    return (await r.json()).id;
  }

  async function download(id){
    const r = await api('https://www.googleapis.com/drive/v3/files/'+id+'?alt=media');
    return await r.blob();
  }

  async function findIndex(){
    if(indexId) return indexId;
    const fid = await ensureFolder();
    const q = encodeURIComponent("name='"+INDEX_FILE+"' and '"+fid+"' in parents and trashed=false");
    const r = await api('https://www.googleapis.com/drive/v3/files?q='+q+'&fields=files(id)');
    const j = await r.json();
    indexId = (j.files && j.files[0]) ? j.files[0].id : null;
    return indexId;
  }

  function slim(r){            // 목록 파일에 넣을 가벼운 꼴 (사진 알맹이는 빼고)
    return {
      id:r.id, createdAt:r.createdAt, lat:r.lat, lng:r.lng, acc:r.acc,
      alt:r.alt, altAcc:r.altAcc, heading:r.heading,
      origLat:r.origLat, origLng:r.origLng, moved:!!r.moved, memo:r.memo||'', addr:r.addr||'',
      media:(r.media||[]).filter(m=>m.driveId).map(m=>({
        type:m.type, mime:m.mime, size:m.size, dur:m.dur,
        name:m.name, driveId:m.driveId, thumbId:m.thumbId||null
      }))
    };
  }

  async function writeIndex(){
    const all = await DB.all();
    const body = new Blob([JSON.stringify(
      {version:1, savedAt:Date.now(), records: all.map(slim).filter(r=>r.media.length)}
    )], {type:'application/json'});
    const id = await findIndex();
    if(id) await overwriteBlob(id, body, 'application/json');
    else   indexId = await uploadBlob(body, INDEX_FILE, 'application/json');
  }

  async function pushRecord(rec, onStep){
    let changed = false;
    for(let i=0;i<(rec.media||[]).length;i++){
      const m = rec.media[i];
      if(m.driveId) continue;
      const b = mediaBlob(m);
      if(!b) continue;
      const ext = (m.type==='video') ? ((m.mime||'').includes('mp4')?'mp4':'webm') : 'jpg';
      const nm  = fileStamp(rec.createdAt)+'_'+(i+1)+'.'+ext;
      if(onStep) onStep(nm);
      m.driveId = await uploadBlob(b, nm, m.mime || (m.type==='video'?'video/webm':'image/jpeg'));
      m.name = nm;
      if(m.thumbBuf && !m.thumbId){
        try{
          m.thumbId = await uploadBlob(new Blob([m.thumbBuf],{type:'image/jpeg'}),
                                       nm.replace(/\.\w+$/,'')+'_t.jpg', 'image/jpeg');
        }catch(e){}
      }
      changed = true;
    }
    if(changed) await DB.put(rec);
    return changed;
  }

  async function pushAll(onStep){
    const all = await DB.all();
    let n = 0;
    for(const r of all){
      if((r.media||[]).every(m=>m.driveId)) continue;
      if(await pushRecord(r, onStep)) n++;
    }
    await writeIndex();
    await loadRecords();
    return n;
  }

  async function pullAll(onStep){
    const id = await findIndex();
    if(!id) return 0;
    const txt = await (await download(id)).text();
    let j = null;
    try{ j = JSON.parse(txt); }catch(e){ return 0; }
    const list = (j && j.records) || [];
    let n = 0;
    for(const r of list){
      const here = await DB.get(r.id);
      if(here) continue;                       // 이미 있으면 그대로 둔다
      if(onStep) onStep(fmtDT(r.createdAt));
      const rec = Object.assign({}, r);
      rec.media = (r.media||[]).map(m=>Object.assign({}, m));  // 알맹이는 열 때 받는다
      for(const m of rec.media){
        if(m.thumbId){
          try{ m.thumbBuf = await (await download(m.thumbId)).arrayBuffer(); }catch(e){}
        }
      }
      await DB.put(rec);
      n++;
    }
    await loadRecords();
    return n;
  }

  /* 사진 알맹이를 아직 안 받은 기록을 열 때 쓴다 */
  async function fetchMedia(rec, i){
    const m = rec.media[i];
    if(!m || m.buf || !m.driveId) return null;
    const b = await download(m.driveId);
    m.buf = await b.arrayBuffer();
    try{ await DB.put(rec); }catch(e){}
    return b;
  }

  function paint(){
    const b = $('#btnDrive');
    if(!b) return;
    let linked = false;
    try{ linked = !!localStorage.getItem('jd_linked'); }catch(e){}
    b.textContent = signedIn() ? '드라이브' : (linked ? '맞추기' : '로그인');
    const el2 = document.querySelector('#hdr .me');
    if(el2) el2.textContent = signedIn() ? (me||'') : '';
  }

  async function signIn(){
    try{ await getToken(''); }          // 전에 허용했으면 조용히 지나간다
    catch(e){ await getToken('consent'); }
    try{
      const r = await fetch('https://www.googleapis.com/oauth2/v3/userinfo', {headers:hdr()});
      if(r.ok){ const u = await r.json(); me = u.email || u.name || ''; }
    }catch(e){}
    try{
      localStorage.setItem('jd_me', me);
      localStorage.setItem('jd_linked', '1');     // 로그인한 적이 있다는 표시
    }catch(e){}
    paint();
  }

  function signOut(){
    try{ if(token && google.accounts.oauth2) google.accounts.oauth2.revoke(token, ()=>{}); }catch(e){}
    token=null; tokenAt=0; folderId=null; indexId=null;
    try{ localStorage.removeItem('jd_linked'); localStorage.removeItem('jd_me'); }catch(e){}
    me='';
    paint();
  }

  /* 가져오고 올리기를 한 번에 — 손님은 방향을 생각할 필요가 없다 */
  let lastSync = 0;
  async function sync(onStep){
    if(busy) return {got:0, sent:0};
    busy = true;
    try{
      const got  = await pullAll(onStep);
      const sent = await pushAll(onStep);
      lastSync = Date.now();
      try{ localStorage.setItem('jd_sync', String(lastSync)); }catch(e){}
      return {got, sent};
    } finally { busy = false; }
  }
  function lastSyncAt(){
    if(lastSync) return lastSync;
    try{ return Number(localStorage.getItem('jd_sync')||0); }catch(e){ return 0; }
  }

  /* 앱을 열 때 조용히 이어 붙기 (전에 허용한 적이 있으면 묻지 않는다) */
  async function resume(){
    try{
      if(!window.google || !google.accounts || !google.accounts.oauth2) return false;
      if(!localStorage.getItem('jd_linked')) return false;
      await getToken('none');
      paint();
      return true;
    }catch(e){ return false; }
  }

  return {signedIn, signIn, signOut, pushAll, pullAll, pushRecord, sync, lastSyncAt, resume,
          fetchMedia, writeIndex, paint, who:()=>me,
          isBusy:()=>busy, setBusy:v=>{busy=v;}};
})();

/* ── 머리말 단추 ───────────────────────────────────────────── */
$('#btnDrive').onclick = async ()=>{
  if(!Drive.signedIn()){
    try{
      await Drive.signIn();
      toast('기록을 맞추는 중입니다…', 2400);
      await runSync(false);
    }catch(e){ toast(e.message || '로그인하지 못했습니다.', 3600); }
    return;
  }
  driveMenu();
};

/* 가져오고 올리기를 한 번에 한다 */
async function runSync(quiet){
  try{
    const r = await Drive.sync();
    const bits = [];
    if(r.got)  bits.push('가져온 기록 '+r.got+'개');
    if(r.sent) bits.push('올린 기록 '+r.sent+'개');
    if(bits.length) toast(bits.join(' · '), 3400);
    else if(!quiet) toast('이미 다 맞춰져 있습니다.', 2400);
    Drive.paint();
  }catch(e){
    if(!quiet) toast('맞추지 못했습니다: '+(e.message||''), 4200);
  }
}

async function driveMenu(){
  const t = Drive.lastSyncAt();
  await dialog({
    title:'구글 드라이브',
    text: (Drive.who()? Drive.who()+'\n' : '') +
          '사진·영상과 메모가 손님 드라이브의 「지도일기」 폴더에 담깁니다. ' +
          '이 앱이 만든 파일만 다룹니다.' +
          (t ? '\n마지막으로 맞춘 때: '+fmtDT(t) : '\n아직 맞춘 적이 없습니다.'),
    html:'<label for="dAct">무엇을 할까요</label>'+
         '<select id="dAct">'+
           '<option value="sync">지금 맞추기</option>'+
           '<option value="out">로그아웃</option>'+
         '</select>',
    yes:'하기', no:'닫기',
    hold: async (done)=>{
      const act = $('#dAct').value;
      if(act==='out'){ Drive.signOut(); done(true); toast('로그아웃했습니다.'); return; }
      dlgProg('맞추는 중…');
      try{
        const r = await Drive.sync(x=>dlgProg('맞추는 중… '+x));
        dlgProg(''); done(true);
        const bits=[];
        if(r.got)  bits.push('가져온 기록 '+r.got+'개');
        if(r.sent) bits.push('올린 기록 '+r.sent+'개');
        toast(bits.length? bits.join(' · ') : '이미 다 맞춰져 있습니다.', 3400);
      }catch(e){
        dlgProg('');
        toast('맞추지 못했습니다: '+(e.message||''), 4600);
      }
    }
  });
}
</script>
